version: "3.8"

services:
  # ─── 1. PostgreSQL Database with Spatial Schema ───────────────
  postgres:
    image: postgres:15-alpine
    container_name: resq-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: resq_admin
      POSTGRES_PASSWORD: resq_hackathon_2026
      POSTGRES_DB: resq_db
    volumes:
      - resq_pgdata:/var/lib/postgresql/data
      - ./documentation/disaster_relief_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resq_admin -d resq_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - resq-network

  # ─── 2. Python FastAPI ML & Optimization Engine ───────────────
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: resq-ml
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ML_PORT=8001
      - PYTHONUNBUFFERED=1
      - VISION_CONFIDENCE_THRESHOLD=0.40
      - VISION_MODEL=yolov8n.pt
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - resq-network

  # ─── 3. Node.js API Gateway & WebSocket Server ────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resq-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://resq_admin:resq_hackathon_2026@postgres:5432/resq_db
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=resq_db
      - DB_USER=resq_admin
      - DB_PASSWORD=resq_hackathon_2026
      - ML_SERVICE_URL=http://ml:8001
      - ML_STUB=false
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - resq-network

  # ─── 4. React Tactical Command Dashboard ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3001/api
        - VITE_WS_URL=http://localhost:3001
        - VITE_GOOGLE_MAPS_API_KEY=AIzaSyDZojGFlhw4u_hUT1iZmIL9ggHy_uPHBHo
    container_name: resq-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - resq-network

volumes:
  resq_pgdata:
    driver: local

networks:
  resq-network:
    driver: bridge
